name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Syntax & Critical Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,demo

      - name: Code Style & Complexity Warnings
        run: |
          # Non-blocking style checks for complexity and length
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=venv,.venv,demo

      - name: Run Pytest Test Suite
        run: |
          pytest -v

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: cheeku-voice-os:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container and Verify /health Endpoint
        run: |
          docker run -d --name cheeku-instance -p 8000:8000 cheeku-voice-os:ci
          echo "Waiting for Cheeku server to initialize..."
          for i in {1..20}; do
            STATUS=$(curl -s http://localhost:8000/health || echo "connecting")
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q '"status":"healthy"'; then
              echo "✅ Healthcheck passed successfully!"
              break
            fi
            sleep 1
          done
          # Assert health check is 200 OK
          curl -f http://localhost:8000/health || (docker logs cheeku-instance && exit 1)

      - name: Run Automated Tests Inside Docker Container
        run: |
          docker exec cheeku-instance pytest -q

      - name: Clean up Docker resources
        if: always()
        run: |
          docker stop cheeku-instance || true
          docker rm cheeku-instance || true

